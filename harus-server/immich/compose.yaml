name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:release
    env_file:
      - prod.env
    volumes:
      - ${IMMICH_VOLUME}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "2283:2283"
    depends_on:
      - redis
      - database
    restart: always
    networks:
      - harus_network
    labels:
      glance.name: Immich
      glance.icon: si:immich
      glance.url: https://immich.domain.com
      glance.description: Image & video management
      glance.id: immich

  redis:
    container_name: immich_redis
    image: mirror.gcr.io/bitnami/valkey:8.0
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - VALKEY_AOF_ENABLED=yes
    volumes:
      - ${IMMICH_REDIS_VOLUME}:/bitnami/valkey/data
    restart: always
    networks:
      - harus_network
    labels:
      glance.parent: immich
      glance.name: Redis

  database:
    container_name: immich_postgres
    image: mirror.gcr.io/tensorchord/pgvecto-rs:pg16-v0.2.1
    env_file:
      - prod.env
    volumes:
      - ${IMMICH_DB_VOLUME}:/var/lib/postgresql/data
    networks:
      - harus_network
    labels:
      glance.parent: immich
      glance.name: DB

networks:
  harus_network:
    external: true
    driver: bridge
