name: clickhouse-stack

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.4
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - "100.74.111.28:8123:8123"
      - "100.74.111.28:9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - harus_network
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - IPC_LOCK
    environment:
      - CLICKHOUSE_DB=database
      - CLICKHOUSE_USER=root
      - CLICKHOUSE_PASSWORD=password
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_DEFAULT_PROFILE=default
      - CLICKHOUSE_DEFAULT_QUOTA=default
      - CLICKHOUSE_DEFAULT_ROLE=default
      - CLICKHOUSE_ENABLE_HTTP_COMPRESSION=1
      - CLICKHOUSE_ENABLE_HTTP_COMPRESSION_METHODS=0
      - CLICKHOUSE_ENABLE_HTTP_COMPRESSION_LEVEL=6

volumes:
  clickhouse_data:
    driver: local

networks:
  harus_network:
    external: true
