name: canal-dev-services

services:
  mysql:
    image: bitnami/mysql:5.7.43
    container_name: mysql
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - ./my_canal.cnf:/opt/bitnami/mysql/conf/my_custom.cnf:ro
      - mysql_data:/bitnami/mysql/data
    ports:
      - "100.89.137.15:23306:3306"
    networks:
      - harus_network

  kafka:
    image: bitnami/kafka:4.0
    container_name: kafka
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    ports:
      - "100.89.137.15:50000:9092"
    volumes:
      - kafka_data:/bitnami/kafka/data
    networks:
      - harus_network

  canal-server:
    image: canal/canal-server:v1.1.8
    container_name: canal-server
    depends_on:
      - mysql
      - kafka
    environment:
    - canal.serverMode=kafka
    - kafka.bootstrap.servers=kafka:9092
    - canal.instance.master.address=mysql:3306
    - canal.instance.dbUsername=canal
    - canal.instance.dbPassword=canal
    - canal.mq.topic=harus_canal_topic
    - canal.mq.partition=3
    - canal.mq.partitionHash=.*\\..*:id
    ports:
      - "100.89.137.15:50001:11111"
    volumes:
      - ./logs:/home/admin/canal-server/logs
      - /etc/localtime:/etc/localtime:ro
    networks:
      - harus_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "100.89.137.15:50002:8080"
    environment:
      - DYNAMIC_CONFIG_ENABLED=true
    volumes:
      - kafka_ui_data:/etc/kafkaui
    networks:
      - harus_network
    depends_on:
      - kafka

networks:
  harus_network:
    driver: bridge
    external: true

volumes:
  mysql_data:
  kafka_data:
  kafka_ui_data:
